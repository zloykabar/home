<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <title>WiZ Управление</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>💡 WiZ Свет</h1>
            <div class="status" id="connectionStatus">
                <span class="dot"></span>
                <span>Проверка...</span>
            </div>
        </header>

        <section class="settings-card">
            <h2>Настройки</h2>
            <label>IP ПК (Мост)</label>
            <input type="text" id="bridgeIp" value="192.168.68.60">
            <label>Порт моста</label>
            <input type="number" id="bridgePort" value="8080">
            <button class="btn primary" onclick="saveSettings()">💾 Сохранить</button>
        </section>

        <section class="devices">
            <h2>Устройства</h2>
            <div id="deviceList"></div>
        </section>

        <section class="log">
            <h2>Журнал</h2>
            <div id="logBox"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
